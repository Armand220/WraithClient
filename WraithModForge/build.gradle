plugins {
    id 'net.neoforged.gradle.userdev' version '7.0.145'
}

version   = project.mod_version
group     = project.maven_group
base { archivesName = project.archives_base_name }

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

minecraft { accessTransformers { file('src/main/resources/META-INF/accesstransformer.cfg') } }

runs {
    client {
        workingDirectory project.file('run')
        programArgument '--username=Dev'
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        mods { wraith { source sourceSets.main } }
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${project.neoforge_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "mc_version", project.minecraft_version
    filesMatching("META-INF/mods.toml") {
        expand version: project.version, mc_version: project.minecraft_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 21
}

jar {
    manifest { attributes(['Specification-Title': 'wraith', 'Implementation-Version': project.version]) }
    finalizedBy 'copyToLauncher'
}

tasks.register('copyToLauncher', Copy) {
    dependsOn jar
    from jar.archiveFile
    into '../publish'
    rename { 'WraithModForge.jar' }
}
