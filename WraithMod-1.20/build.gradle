plugins {
    id 'fabric-loom' version '1.3-SNAPSHOT'
}

version = project.mod_version
group   = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
}

// Share most source from WraithMod; only gui package is overridden here (old Screen API)
sourceSets {
    main {
        java {
            srcDir '../WraithMod/src/main/java'
            exclude 'dev/wraith/gui/**'
            srcDir 'src/main/java'
        }
        resources { srcDirs = ['src/main/resources'] }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
    it.options.encoding = "UTF-8"
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.register('copyToLauncher', Copy) {
    dependsOn remapJar
    from remapJar.archiveFile
    into '../publish'
    rename { 'WraithMod-1.20.jar' }
}

build.finalizedBy copyToLauncher
